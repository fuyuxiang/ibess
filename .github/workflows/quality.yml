name: Quality and compatibility
on: [push, pull_request]

jobs:
  compatibility:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ibess_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: ibess_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ibess_test -d ibess_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      IBESS_TEST_REDIS_URL: redis://localhost:6379/15
      IBESS_TEST_DATABASE_URL: postgresql+psycopg://ibess_test:ci-test-only@localhost:5432/ibess_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-console/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements/dev.lock
      - run: python -m pip install --no-deps -e packages/ibess-common
      - run: python scripts/fetch_face_models.py
      - run: npm ci
        working-directory: web-console
      - run: python tools/check.py all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-report
          path: tmp/reports/quality.json

  cpu-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, event-service, media-service, semantic-worker]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg PIP_INDEX_URL=https://pypi.org/simple -f services/${{ matrix.service }}/Dockerfile -t ibess-${{ matrix.service }}:ci .
