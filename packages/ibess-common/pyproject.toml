[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ibess-common"
version = "2.1.0"
description = "Versioned IBESS message contracts and shared persistence mappings"
requires-python = ">=3.11"
dependencies = ["sqlalchemy>=2.0,<3", "jsonschema>=4.23,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ibess_contracts = ["schemas/v2/*.json"]
