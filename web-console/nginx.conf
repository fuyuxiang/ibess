server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # 端口映射到宿主机后（如 3080），重定向必须用相对地址；
    # 否则 nginx 会按容器内监听端口 3000 拼绝对地址，浏览器直接跨域失败
    absolute_redirect off;
    port_in_redirect off;
    client_max_body_size 21m;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location = /verify {
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files /index.html =404;
    }

    # 构建产物文件名带 hash：index.html 已 no-store，这里让浏览器每次都回源验证一次。
    # 演示机改动频繁，旧 chunk 与缓存头叠加会表现成"改了没生效"。
    location /assets/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/ {
        # Docker容器重建后地址可能变化，按服务名动态重新解析。
        resolver 127.0.0.11 valid=5s ipv6=off;
        resolver_timeout 3s;
        set $api_backend api:8000;
        proxy_pass http://$api_backend;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /hls/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        resolver_timeout 3s;
        set $hls_backend mediamtx:8888;
        rewrite ^/hls/(.*)$ /$1 break;
        proxy_pass http://$hls_backend;
        proxy_redirect ~^(/.*)$ /hls$1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $http_host;
    }

    location = /health/ready {
        resolver 127.0.0.11 valid=5s ipv6=off;
        resolver_timeout 3s;
        set $api_backend api:8000;
        proxy_pass http://$api_backend;
        proxy_connect_timeout 3s;
        proxy_read_timeout 12s;
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
