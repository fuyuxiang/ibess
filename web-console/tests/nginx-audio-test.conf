server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 21m;
    location /api/ {
        proxy_pass http://demo-audio-e2e-api:8000;
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
