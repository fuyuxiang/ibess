server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ {
        proxy_pass http://demo-admin-auth-e2e-api:8000;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $http_host;
    }
    location / { try_files $uri $uri/ /index.html; }
}
